name: Build MelonX iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    
    - name: Build
      run: |
        # Try build script first
        if [ -f "./build.sh" ]; then
          chmod +x ./build.sh
          ./build.sh
        elif [ -f "./compile.sh" ]; then
          chmod +x ./compile.sh
          ./compile.sh
        else
          # Find solution file
          SOLUTION=$(find . -name "*.sln" -maxdepth 2 | head -1)
          if [ -n "$SOLUTION" ]; then
            dotnet restore "$SOLUTION"
            dotnet build "$SOLUTION" -c ${{ github.event.inputs.build_type }}
          else
            # Find main project
            MAIN_PROJ=$(find . -name "*.csproj" -path "*/Ryujinx/*" -not -path "*/test*" | head -1)
            if [ -n "$MAIN_PROJ" ]; then
              dotnet restore "$MAIN_PROJ"
              dotnet build "$MAIN_PROJ" -c ${{ github.event.inputs.build_type }}
            else
              echo "❌ No build script or project found"
              echo "Repository contents:"
              ls -la
              find . -name "*.csproj" -maxdepth 3
              exit 1
            fi
          fi
        fi
    
    - name: Package IPA
      run: |
        mkdir -p Payload/MelonX.app
        
        # Copy build artifacts
        find . -name "*.dll" -path "*/${{ github.event.inputs.build_type }}/*" -exec cp {} Payload/MelonX.app/ \; 2>/dev/null || true
        find . -name "*.exe" -path "*/${{ github.event.inputs.build_type }}/*" -exec cp {} Payload/MelonX.app/ \; 2>/dev/null || true
        find . -name "*.dylib" -path "*/${{ github.event.inputs.build_type }}/*" -exec cp {} Payload/MelonX.app/ \; 2>/dev/null || true
        
        # Copy Info.plist
        INFOPLIST=$(find . -name "Info.plist" -not -path "*/Pods/*" | head -1)
        if [ -n "$INFOPLIST" ]; then
          cp "$INFOPLIST" Payload/MelonX.app/
        fi
        
        # Create IPA
        zip -r MelonX.ipa Payload
        mkdir -p build
        mv MelonX.ipa build/
        
        echo "✅ IPA created: build/MelonX.ipa"
        ls -lh build/MelonX.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MelonX-${{ github.run_number }}
        path: build/MelonX.ipa
        retention-days: 90
